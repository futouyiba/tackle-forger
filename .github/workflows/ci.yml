name: CI

run-name: >-
  gate-context event=${{ github.event_name }}
  pr=${{ github.event.pull_request.number || 0 }}
  head=${{ github.event.pull_request.head.sha || github.sha }}
  base=${{ github.event.pull_request.base.sha || github.event.before }}

on:
  pull_request:
    # A move back to Draft starts an all-skipped run in this PR's concurrency
    # group, cancelling any in-flight candidate validation.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  root-v3-app:
    name: Root v3 app (npm)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  windows-line-endings:
    name: Windows line-ending policy
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify CRLF and LF checkout rules
        shell: pwsh
        run: |
          $powerShell = [Text.Encoding]::UTF8.GetString(
            [IO.File]::ReadAllBytes("scripts/start-dev.ps1")
          )
          if (-not $powerShell.Contains("`r`n")) {
            throw "scripts/start-dev.ps1 was not checked out with CRLF"
          }
          if (($powerShell -replace "`r`n", "").Contains("`n")) {
            throw "scripts/start-dev.ps1 contains a lone LF"
          }

          $packageJson = [Text.Encoding]::UTF8.GetString(
            [IO.File]::ReadAllBytes("package.json")
          )
          if ($packageJson.Contains("`r`n")) {
            throw "package.json was not checked out with LF"
          }

      - name: Verify committed whitespace
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          PUSH_BASE_REF: ${{ github.event.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/check-committed-whitespace.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Committed whitespace verification failed"
          }
