name: CI

run-name: >-
  gate-context event=${{ github.event_name }}
  pr=${{ github.event.pull_request.number || 0 }}
  head=${{ github.event.pull_request.head.sha || github.sha }}
  base=${{ github.event.pull_request.base.sha || github.event.before }}

on:
  push:
  pull_request:
  schedule:
    # Independent full verification of the retained historical pnpm workspace.
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-v3-app:
    name: Root v3 app (npm)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  historical-workspace:
    name: Historical workspace (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Evaluate the immutable PR head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: legacy-workspace/pnpm-lock.yaml
      - name: Decide historical workspace scope
        id: historical-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          full_run=false
          reason="nonlegacy_paths_only"
          base=""

          # Scheduled and manually-dispatched runs are the independent full check.
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            full_run=true
            reason="independent_full_verification"
          elif [[ -z "$EXPECTED_HEAD" ]] || ! git cat-file -e "$EXPECTED_HEAD^{commit}" \
            || [[ "$(git rev-parse HEAD)" != "$EXPECTED_HEAD" ]]; then
            full_run=true
            reason="missing_or_invalid_head_identity"
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE_SHA"
            elif [[ "$EVENT_NAME" == "push" ]]; then
              base="$PUSH_BEFORE_SHA"
            else
              full_run=true
              reason="unsupported_event"
            fi

            # An absent, zero, non-commit, or non-ancestor base is never trusted
            # to prove a nonlegacy change set.
            if [[ "$full_run" != true ]]; then
              if [[ -z "$base" || "$base" =~ ^0+$ ]] \
                || ! git cat-file -e "$base^{commit}" \
                || ! git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"; then
                full_run=true
                reason="missing_or_invalid_base_identity"
              else
                # Do not pipe this diff to grep: grep -q can close the pipe
                # early, making git report SIGPIPE under pipefail.  git diff
                # --quiet has an exact three-way outcome: 0 unchanged, 1
                # changed, or >1 unable to prove the scope.
                if git diff --quiet "$base" "$EXPECTED_HEAD" -- \
                  apps packages legacy-workspace \
                  tsconfig.base.json vitest.workspace.config.ts \
                  tests/package-manager-boundaries.test.mjs \
                  package.json package-lock.json .github/workflows/ci.yml; then
                  :
                else
                  diff_status=$?
                  full_run=true
                  if [[ "$diff_status" == 1 ]]; then
                    reason="historical_workspace_inputs_changed"
                  else
                    reason="historical_workspace_scope_diff_unavailable"
                  fi
                fi
              fi
            fi
          fi

          printf 'full=%s\n' "$full_run" >> "$GITHUB_OUTPUT"
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
          {
            echo '### Historical workspace scope decision'
            echo
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Head: \`$EXPECTED_HEAD\`"
            echo "- Base: \`${base:-not-required}\`"
            echo "- Decision: \`$([[ "$full_run" == true ]] && echo full || echo skip)\`"
            echo "- Reason: \`$reason\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify package-manager boundary
        if: steps.historical-scope.outputs.full == 'true'
        run: node --test tests/package-manager-boundaries.test.mjs
      - name: Install historical workspace
        if: steps.historical-scope.outputs.full == 'true'
        run: pnpm --dir legacy-workspace install --frozen-lockfile
      - name: Typecheck historical workspace
        if: steps.historical-scope.outputs.full == 'true'
        run: pnpm --dir legacy-workspace --filter '@tackle-forger/*' typecheck
      - name: Lint historical workspace
        if: steps.historical-scope.outputs.full == 'true'
        run: pnpm --dir legacy-workspace --filter '@tackle-forger/*' lint
      - name: Test historical workspace
        if: steps.historical-scope.outputs.full == 'true'
        run: pnpm --dir legacy-workspace --filter '@tackle-forger/*' test
      - name: Build historical workspace
        if: steps.historical-scope.outputs.full == 'true'
        run: pnpm --dir legacy-workspace --filter '@tackle-forger/*' build

  windows-line-endings:
    name: Windows line-ending policy
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify CRLF and LF checkout rules
        shell: pwsh
        run: |
          $powerShell = [Text.Encoding]::UTF8.GetString(
            [IO.File]::ReadAllBytes("scripts/start-dev.ps1")
          )
          if (-not $powerShell.Contains("`r`n")) {
            throw "scripts/start-dev.ps1 was not checked out with CRLF"
          }
          if (($powerShell -replace "`r`n", "").Contains("`n")) {
            throw "scripts/start-dev.ps1 contains a lone LF"
          }

          $packageJson = [Text.Encoding]::UTF8.GetString(
            [IO.File]::ReadAllBytes("package.json")
          )
          if ($packageJson.Contains("`r`n")) {
            throw "package.json was not checked out with LF"
          }

      - name: Verify committed whitespace
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          PUSH_BASE_REF: ${{ github.event.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/check-committed-whitespace.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Committed whitespace verification failed"
          }
